name: Build & Push Docker Images

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: "Build & Push ${{ matrix.service }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            image: fullstack-frontend

          - service: backend
            context: ./backend
            image: fullstack-backend

          - service: mysql
            context: ./mysql
            image: fullstack-mysql

          - service: prometheus
            context: ./prometheus
            image: kamka-prometheus

          - service: grafana
            context: ./grafana
            image: kamka-grafana

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Detect if any files inside the matrix context directory changed
      - name: Check for changes in this service
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed:
              - '${{ matrix.context }}/**'

      - name: Set up Node.js (for lint & test)
        if: matrix.service == 'backend' && steps.filter.outputs.changed == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install backend dependencies
        if: matrix.service == 'backend' && steps.filter.outputs.changed == 'true'
        working-directory: ./backend
        run: npm install

      - name: Lint backend
        if: matrix.service == 'backend' && steps.filter.outputs.changed == 'true'
        working-directory: ./backend
        run: npm run lint

      - name: Test backend
        if: matrix.service == 'backend' && steps.filter.outputs.changed == 'true'
        working-directory: ./backend
        run: npm test

      - name: Set up Docker Buildx
        if: steps.filter.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.filter.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.run_number }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push ${{ matrix.service }} image
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: "Deploy to AKS"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        # Authenticate with the cluster using the kubeconfig stored securely in repository secrets
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}
          kubeconfig-encoding: base64

      - name: Deploy Database and Applications
        run: |
          # Apply database storage and MySQL deployment
          kubectl apply -f kubernetes/mysql.yaml
          
          # Deploy backend and frontend app services
          kubectl apply -f kubernetes/backend.yaml
          kubectl apply -f kubernetes/frontend.yaml

      - name: Deploy Monitoring Stack
        run: |
          kubectl apply -f kubernetes/monitoring.yaml

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/mysql-service
          kubectl rollout status deployment/backend-service
          kubectl rollout status deployment/frontend-service



